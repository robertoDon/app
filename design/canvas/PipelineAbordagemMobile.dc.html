<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Follou — Abordagem (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0E7038;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 60px 16px 0; background: #F4F1EC; color: #1A1815; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">

  <header>
    <a href="PipelineNegocioMobile.dc.html" style="height: 44px; margin-left: -4px; padding-right: 8px; display: inline-flex; align-items: center; gap: 2px; color: #1A1815; font-size: 16px; font-weight: 500; text-decoration: none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Nuvem Labs</a>
  </header>

  <div>
    <h1 style="margin: 0; font-family: 'Archivo', 'IBM Plex Sans', system-ui, sans-serif; font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: -0.035em">Abordagem</h1>
    <p style="margin: 2px 0 0; font-size: 12px; line-height: 16px; color: #57524B">{{subtitulo}}</p>
  </div>

  <div role="group" aria-label="Etapa da abordagem" style="height: 44px; box-sizing: border-box; padding: 4px; border-radius: 999px; background: #E9E5DE; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 4px">
    <sc-for list="{{etapas}}" as="e" hint-placeholder-count="4">
      <sc-if value="{{e.ativo}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-pressed="true" onClick="{{e.pick}}" style="border: 0; border-radius: 999px; background: #FAF9F7; color: #1A1815; box-shadow: 0 1px 2px rgba(16,15,15,0.08); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap">{{e.rotulo}}<sc-if value="{{e.feito}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></button>
      </sc-if>
      <sc-if value="{{e.inativo}}" hint-placeholder-val="{{true}}">
        <button type="button" aria-pressed="false" onClick="{{e.pick}}" style="border: 0; border-radius: 999px; background: transparent; color: #1A1815; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; transition: background-color 150ms ease-out">{{e.rotulo}}<sc-if value="{{e.feito}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></button>
      </sc-if>
    </sc-for>
  </div>

  <section aria-label="Mensagem" style="display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; padding: 16px; border-radius: 24px 24px 24px 8px; background: #FAF9F7; border: 1px solid #E3DFD7; box-shadow: 0 1px 2px rgba(16,15,15,0.06); font-size: 16px; line-height: 22px">{{texto}}</p>
    <sc-if value="{{mostraSugestao}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 8px">
        <div style="display: flex; align-items: center; gap: 8px"><span style="height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 999px; border: 1px dashed #57524B; color: #57524B; display: inline-flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap">Sugestão do Follou</span><span style="font-size: 12px; line-height: 16px; color: #57524B">Revise antes de mandar</span></div>
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: #57524B">{{fonte}}</p>
      </div>
    </sc-if>
    <sc-if value="{{mostraEnviada}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px">
        <span style="height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 999px; background: #E9E5DE; color: #1A1815; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Enviada · {{quando}}</span>
        <sc-if value="{{podeDesfazer}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{desfazer}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #1A1815; font: inherit; font-size: 16px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Desfazer</button></sc-if>
      </div>
    </sc-if>
  </section>

  <sc-if value="{{mostraAcoes}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 104px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" onClick="{{enviar}}" style="box-sizing: border-box; border: 0; border-radius: 999px; background: #0E7038; color: #FAF9F7; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background-color 150ms ease-out; height: 48px; width: 100%"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path></svg>Abrir no WhatsApp</button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" onClick="{{copiar}}" style="height: 44px; box-sizing: border-box; border: 1px solid #E3DFD7; border-radius: 999px; background: #FAF9F7; color: #1A1815; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background-color 150ms ease-out">{{rotuloCopiar}}</button>
        <button type="button" onClick="{{outra}}" style="height: 44px; box-sizing: border-box; border: 1px solid #E3DFD7; border-radius: 999px; background: #FAF9F7; color: #1A1815; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background-color 150ms ease-out">Outra versão</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{mostraProximo}}" hint-placeholder-val="{{false}}">
    <section aria-label="Próximo" style="position: absolute; left: 16px; right: 16px; bottom: 104px; border-radius: 24px; background: #FAF9F7; border: 1px solid #E3DFD7; box-shadow: 0 1px 2px rgba(16,15,15,0.06); padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="min-width: 0">
        <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #57524B">Próximo</p>
        <p style="margin: 2px 0 0; font-size: 16px; line-height: 22px; font-weight: 600">Vela Apps</p>
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: #57524B">Proposta · revisar o escopo · hoje, 16h</p>
      </div>
      <a href="#" style="box-sizing: border-box; border: 0; border-radius: 999px; background: #0E7038; color: #FAF9F7; font: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background-color 150ms ease-out; height: 48px; padding: 0 20px; flex-shrink: 0">Abrir</a>
    </section>
  </sc-if>

  <sc-if value="{{mostraNota}}" hint-placeholder-val="{{false}}">
    <p style="position: absolute; left: 24px; right: 24px; bottom: 120px; margin: 0; font-size: 12px; line-height: 16px; color: #57524B; text-align: center">Foi no dia 12/10. Quando a Ana responder, a resposta aparece aqui.</p>
  </sc-if>

  <nav aria-label="Navegação" style="position: absolute; left: 63px; width: 264px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.72); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(16,15,15,0.08); box-shadow: 0 1px 2px rgba(16,15,15,0.06), 0 12px 32px rgba(16,15,15,0.14); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <a href="HojeMobile.dc.html" style="border-radius: 999px; color: #57524B; font-weight: 500; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; transition: background-color 150ms ease-out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18"></path><path d="M7 18a5 5 0 0 1 10 0"></path><path d="M12 6v3"></path><path d="M5.6 10.6l1.6 1.6"></path><path d="M18.4 10.6l-1.6 1.6"></path></svg>Hoje</a>
    <a href="PipelineMobile.dc.html" aria-current="page" style="border-radius: 999px; background: #100F0F; color: #F4F1EC; font-weight: 600; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; transition: background-color 150ms ease-out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4.5" height="16" rx="1.5"></rect><rect x="9.75" y="4" width="4.5" height="11" rx="1.5"></rect><rect x="16" y="4" width="4.5" height="7" rx="1.5"></rect></svg>Pipeline</a>
    <a href="CacadaMobile.dc.html" style="border-radius: 999px; color: #57524B; font-weight: 500; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; transition: background-color 150ms ease-out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>Caçada</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  etapas() {
    return [
      { rotulo: '1º contato', quando: '12/10', textos: ['Oi, Ana! Vi que a Nuvem Labs está montando o time de produto. Fazemos sites e apps para software houses e agências. Posso te mandar um exemplo?'], fonte: '' },
      { rotulo: 'F1', quando: 'hoje', textos: [
        'Oi, Ana! Na nossa conversa do dia 17 você comentou que querem trocar a planilha até dezembro. Montei um rascunho de como ficaria o painel de vocês. Te mostro em 20 minutos esta semana?',
        'Oi, Ana! Lembrei do que você disse no dia 17 sobre sair da planilha até dezembro. Tenho um rascunho do painel pronto. Quer ver em 20 minutos?'
      ], fonte: 'Baseado na reunião de 17/10 · sai hoje' },
      { rotulo: 'F2', quando: 'hoje', textos: [
        'Oi, Ana! Voltando ao painel que te mostrei. Se fizer sentido, separo 20 minutos na semana que vem para ajustar o escopo com você.',
        'Oi, Ana! Ficou alguma dúvida sobre o painel? Posso ajustar o escopo antes de a gente conversar de novo.'
      ], fonte: 'Entra 5 dias depois da F1 · pronta para 6/11' },
      { rotulo: 'F3', quando: 'hoje', textos: [
        'Última por aqui, Ana: se o momento mudou, sem problema. Deixo o painel salvo no link caso queiram retomar em dezembro.',
        'Ana, vou encerrar por aqui para não encher sua caixa. O painel fica salvo e a porta fica aberta para dezembro.'
      ], fonte: 'Entra 7 dias depois da F2 · pronta para 13/11' }
    ];
  }
  renderVals() {
    const s = this.state || {};
    const i = s.etapa ?? 1;
    const env = s.env ?? { 0: true };
    const v = s.v ?? 0;
    const xs = this.etapas();
    const e = xs[i];
    const foi = !!env[i];
    const primeira = i === 0;
    return {
      subtitulo: primeira ? '1º contato para Ana Ribeiro' : 'Follow-up ' + i + ' para Ana Ribeiro',
      etapas: xs.map((x, k) => ({
        rotulo: x.rotulo,
        feito: !!env[k],
        ativo: k === i,
        inativo: k !== i,
        pick: () => this.setState({ etapa: k, v: 0, copiado: false })
      })),
      texto: e.textos[primeira ? 0 : v % e.textos.length],
      fonte: e.fonte,
      quando: primeira ? '12/10' : 'agora',
      mostraSugestao: !foi,
      mostraEnviada: foi,
      podeDesfazer: foi && !primeira,
      mostraAcoes: !foi,
      mostraProximo: foi && !primeira,
      mostraNota: primeira,
      rotuloCopiar: s.copiado ? 'Copiado' : 'Copiar',
      enviar: () => this.setState({ env: { ...env, [i]: true }, copiado: false }),
      desfazer: () => this.setState({ env: { ...env, [i]: false } }),
      copiar: () => this.setState({ copiado: true }),
      outra: () => this.setState({ v: v + 1, copiado: false })
    };
  }
}
</script>
</body>
</html>
